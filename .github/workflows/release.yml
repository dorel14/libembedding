name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # 1) semantic-release: determine version, bump pyproject.toml, create tag + GitHub release
  version:
    name: Version & Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        run: pip install python-semantic-release==10.1.0

      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: python
        run: |
          VERSION="$(python -m semantic_release version --print)"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            # Skip if tag already exists
            if git ls-remote --tags origin "v${VERSION}" | grep -q "v${VERSION}"; then
              echo "Tag v${VERSION} already exists — skipping"
            else
              echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
              echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
              echo "Detected version: ${VERSION}"
            fi
          else
            echo "No release required: ${VERSION}"
          fi

      - name: Create release (bumps pyproject.toml, creates tag + GitHub release)
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: python
        run: python -m semantic_release version --vcs-release

  # 2) Rebuild wheels against the new tag (version matches tag)
  build-wheels:
    name: Build release wheels (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/build-wheel.yml
    with:
      os: ${{ matrix.os }}
      python: ${{ matrix.python }}
      ref: ${{ needs.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            python: "3.12"
          - os: macos-14
            name: macos-arm64
            python: "3.12"
          - os: windows-2022
            name: windows-x86_64
            python: "3.12"

  # 3) Publish all wheels to PyPI using PYPI_TOKEN
  publish:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: List wheels
        run: ls -la dist/

      - name: Publish to PyPI (via PYPI_TOKEN)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}