name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # 1) Determine the next version and create the tag + GitHub release.
  version:
    name: Version & Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        run: pip install pydantic==1.10.12 python-semantic-release==9.4.0

      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: python
        run: |
          VERSION="$(python -m semantic_release version --print)"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            # Skip if the tag already exists (nothing new to release)
            if git ls-remote --tags origin "v${VERSION}" | grep -q "v${VERSION}"; then
              echo "Tag v${VERSION} already exists — nothing to release"
            else
              echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
              echo "Detected version: ${VERSION}"
            fi
          else
            echo "No release required: ${VERSION}"
          fi

      - name: Skip if release commit
        id: skip
        run: |
          LAST_MSG="$(git log -1 --pretty=%B)"
          if echo "$LAST_MSG" | grep -qE '^chore\(release\):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release (tag + GitHub release)
        if: steps.version.outputs.version != '' && steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: python
        run: |
          TAG="v${VERSION}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists remotely"
          else
            python -m semantic_release version --vcs-release
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$VERSION" --generate-notes
          fi

  # 2) Rebuild the wheels against the new tag so the wheel version matches the tag.
  build-wheels:
    name: Build release wheels (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/build-wheel.yml
    with:
      os: ${{ matrix.os }}
      python: ${{ matrix.python }}
      ref: v${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            python: "3.12"
          - os: macos-14
            name: macos-arm64
            python: "3.12"
          - os: windows-2022
            name: windows-x86_64
            python: "3.12"

  # 3) Publish all wheels to PyPI.
  publish:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: List wheels
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
