name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: ${{ matrix.name }}
    uses: ./.github/workflows/build-wheel.yml
    with:
      os: ${{ matrix.os }}
      python: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            python: "3.12"
          - os: macos-14
            name: macos-arm64
            python: "3.12"
          - os: windows-2022
            name: windows-x86_64
            python: "3.12"

  release:
    name: Tag, GitHub Release & Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version' python/pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION  ->  Tag: v$VERSION"

      - name: Create and push git tag
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally"
            echo "new_tag=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists remotely"
            echo "new_tag=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "new_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: List wheels
        run: ls -la dist/

      - name: Create GitHub release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets only"
            gh release upload "$TAG" dist/*.whl --clobber
          else
            gh release create "$TAG" dist/*.whl --title "$VERSION" --generate-notes
          fi

      - name: Publish to PyPI (OIDC trusted publisher)
        if: steps.tag.outputs.new_tag == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
