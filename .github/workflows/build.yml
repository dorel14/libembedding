name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.name }}
    uses: ./.github/workflows/build-wheel.yml
    with:
      os: ${{ matrix.os }}
      python: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            python: "3.12"
          - os: macos-14
            name: macos-arm64
            python: "3.12"
          - os: macos-13
            name: macos-x86_64
            python: "3.12"
          - os: windows-2022
            name: windows-x86_64
            python: "3.12"
