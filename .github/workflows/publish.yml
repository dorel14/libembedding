name: Publish to PyPI

on:
  release:
    types: [published]

# Permissions for PyPI trusted publishing (OIDC)
permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    uses: ./.github/workflows/build-wheel.yml
    with:
      os: ${{ matrix.os }}
      python: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            python: "3.12"
          - os: macos-14
            name: macos-arm64
            python: "3.12"
          - os: macos-13
            name: macos-x86_64
            python: "3.12"
          - os: windows-2022
            name: windows-x86_64
            python: "3.12"

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: List downloaded wheels
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
